services:
  - type: keyvalue
    name: swiftcollab-dev-cache
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: swiftcollab-dev
    runtime: node
    region: singapore
    plan: free
    branch: develop
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build && cd backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: swiftcollab-dev-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swiftcollab-dev-cache
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN_MS
        value: "604800000"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: TEMPORAL_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false

databases:
  - name: swiftcollab-dev-db
    databaseName: swiftcollab_dev
    user: swiftcollab_dev
    region: singapore
    plan: free
